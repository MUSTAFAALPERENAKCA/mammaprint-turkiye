name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mammaprint
          POSTGRES_PASSWORD: mammaprint
          POSTGRES_DB: mammaprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mammaprint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mammaprint:mammaprint@localhost:5432/mammaprint?schema=public
      AUTH_SECRET: ci-only-secret-do-not-use-in-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build
